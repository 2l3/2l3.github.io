<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دليل المواقع</title>

<style>
body {
    font-family: Tahoma;
    background: #f5f5f5;
    margin: 0;
}

header {
    background: #202020;
    color: white;
    padding: 15px;
    text-align: center;
}

nav {
    background: #333;
    padding: 10px;
    text-align: center;
}

nav a {
    color: white;
    margin: 10px;
    text-decoration: none;
    font-weight: bold;
}

.container {
    padding: 20px;
}

.section {
    background: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
}

.section h2 {
    border-bottom: 2px solid #202020;
    padding-bottom: 5px;
}

.links {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 10px;
}

.links a {
    background: #eee;
    padding: 10px;
    text-align: center;
    border-radius: 5px;
    text-decoration: none;
    color: black;
    transition: 0.3s;
}

.links a:hover {
    background: #202020;
    color: white;
}

footer {
    background: #202020;
    color: white;
    text-align: center;
    padding: 10px;
}
</style>
</head>

<body>

<header>
    <h1>دليل أفضل المواقع</h1>
</header>

<nav>
    <a href="#">الرئيسية</a>
    <a href="#">الأكثر زيارة</a>
    <a href="#">خدمات</a>
    <a href="#">اتصل بنا</a>
</nav>

<div class="container">

    <!-- قسم مواقع مشهورة -->
    <div class="section">
        <h2>🌐 مواقع مشهورة</h2>
        <div class="links">
            <a href="https://google.com">Google</a>
            <a href="https://youtube.com">YouTube</a>
            <a href="https://facebook.com">Facebook</a>
            <a href="https://twitter.com">Twitter</a>
        </div>
    </div>

    <!-- قسم خدمات -->
    <div class="section">
        <h2>⚙️ خدمات مفيدة</h2>
        <div class="links">
            <a href="#">الطقس</a>
            <a href="#">التوقيت</a>
            <a href="#">حاسبة</a>
            <a href="#">ترجمة</a>
        </div>
    </div>

    <!-- قسم أخبار -->
    <div class="section">
        <h2>📰 أخبار</h2>
        <div class="links">
            <a href="#">العربية</a>
            <a href="#">BBC</a>
            <a href="#">CNN</a>
            <a href="#">سكاي نيوز</a>
        </div>
    </div>

</div>

<footer>
    جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>
